openapi: 3.1.0
info:
  title: DDCRM External API
  version: 0.1.0
  description: Публичный API-контур DDCRM (frontend/client -> platform).
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://api.ddcrm.local
    description: External API
x-cors:
  mode: env
  envFile: .env.external-api.example
  envPrefix: EXTERNAL_API_CORS_
  policy:
    origins: allowlist-only
    wildcardInProduction: forbidden
tags:
  - name: projects
  - name: members
  - name: accounts
  - name: admin
  - name: billing
  - name: gateway-proxy
  - name: integrations

paths:
  /v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список проектов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [projects]
      operationId: createProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}:
    get:
      tags: [projects]
      operationId: getProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Проект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [projects]
      operationId: updateProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Проект обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/members:
    post:
      tags: [members]
      operationId: addMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Участник добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/members/{userId}/role:
    patch:
      tags: [members]
      operationId: changeMemberRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleChangeRequest'
      responses:
        '200':
          description: Роль изменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/members/{userId}:
    delete:
      tags: [members]
      operationId: removeMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Участник удален
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Список аккаунтов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [accounts]
      operationId: createAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '201':
          description: Аккаунт создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/account-types:
    get:
      tags: [accounts]
      operationId: listProjectAccountTypes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Доступные типы аккаунтов для создания в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTypeListResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/account-manager/worker-servers:
    get:
      tags: [admin]
      operationId: adminListWorkerServers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Worker servers для системной админки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorkerServerListResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/account-manager/worker-servers/{serverId}:
    put:
      tags: [admin]
      operationId: adminUpsertWorkerServer
      security:
        - bearerAuth: []
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminWorkerServerUpsertRequest'
      responses:
        '200':
          description: Worker server upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorkerServerResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/account-manager/account-types:
    get:
      tags: [admin]
      operationId: adminListAccountTypes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account type templates для системной админки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountTypeListResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/account-manager/account-types/{accountTypeId}:
    put:
      tags: [admin]
      operationId: adminUpsertAccountType
      security:
        - bearerAuth: []
      parameters:
        - name: accountTypeId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccountTypeUpsertRequest'
      responses:
        '200':
          description: Account type upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountTypeResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/integrations/projects/{projectId}/grants:
    get:
      tags: [admin, integrations]
      operationId: adminListProjectIntegrationGrants
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Список интеграционных grant-ов проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIntegrationGrantListResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/integrations/projects/{projectId}/grants/{integrationKey}:
    put:
      tags: [admin, integrations]
      operationId: adminUpsertProjectIntegrationGrant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: integrationKey
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminIntegrationGrantUpsertRequest'
      responses:
        '200':
          description: Интеграционный grant сохранен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIntegrationGrantResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [admin, integrations]
      operationId: adminRevokeProjectIntegrationGrant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: integrationKey
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Интеграционный grant отозван
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/integrations/telegram/proxies:
    get:
      tags: [admin, integrations]
      operationId: adminListTelegramProxyProfiles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список proxy-профилей Telegram бота
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTelegramProxyProfileListResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/integrations/telegram/proxies/{proxyId}:
    put:
      tags: [admin, integrations]
      operationId: adminUpsertTelegramProxyProfile
      security:
        - bearerAuth: []
      parameters:
        - name: proxyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTelegramProxyProfileUpsertRequest'
      responses:
        '200':
          description: Proxy-профиль Telegram сохранен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTelegramProxyProfileResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/status:
    get:
      tags: [projects, integrations]
      operationId: getProjectIntegrationsStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Статус интеграций проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectIntegrationStatusResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/{integrationKey}/actions/{scope}:
    post:
      tags: [projects, integrations]
      operationId: invokeProjectServiceIntegration
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: integrationKey
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - name: scope
          in: path
          required: true
          schema:
            type: string
            enum: [read, jobs]
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Ответ внешней сервисной интеграции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/telegram/link-codes:
    post:
      tags: [projects, integrations]
      operationId: createTelegramLinkCode
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramLinkCodeCreateRequest'
      responses:
        '200':
          description: Link code создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramLinkCodeResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/telegram/user-bind:
    post:
      tags: [projects, integrations]
      operationId: bindTelegramUserChat
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramUserBindRequest'
      responses:
        '200':
          description: ЛС-привязка Telegram пользователя сохранена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/integrations/telegram/link/confirm:
    post:
      tags: [integrations]
      operationId: confirmTelegramGroupLink
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramLinkConfirmRequest'
      responses:
        '200':
          description: Group-chat привязка подтверждена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/notifications/critical:
    post:
      tags: [projects, integrations]
      operationId: enqueueCriticalNotification
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriticalNotificationRequest'
      responses:
        '202':
          description: Критичное уведомление поставлено в outbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/accounts/{accountId}:
    patch:
      tags: [accounts]
      operationId: updateAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Аккаунт обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [accounts]
      operationId: deleteAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Аккаунт удален
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/accounts/{accountId}/proxy-credentials:
    get:
      tags: [accounts]
      operationId: getAccountProxyCredentialsMasked
      description: Возвращает только маскированные proxy credentials.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Маскированные proxy credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyCredentialsMaskedResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [accounts]
      operationId: updateAccountProxyCredentials
      description: Явное изменение proxy credentials.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyCredentialsUpdateRequest'
      responses:
        '200':
          description: Proxy credentials обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/accounts/{accountId}/proxy-credentials/reveal:
    post:
      tags: [accounts]
      operationId: revealAccountProxyCredentials
      description: Явный просмотр полных proxy credentials (аудит обязателен; доступ по RBAC при активной сессии, без step-up).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyCredentialsRevealRequest'
      responses:
        '200':
          description: Полные proxy credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyCredentialsRevealResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/billing/payments:
    post:
      tags: [billing]
      operationId: createPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Платеж создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObjectResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/billing/addons/{addonId}/purchase:
    post:
      tags: [billing]
      operationId: purchaseAddon
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AddonId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Add-on куплен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObjectResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/billing/subscription/change-plan:
    post:
      tags: [billing]
      operationId: changePlan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: План изменен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/account-api/{routeKey}/{action}:
    post:
      tags: [gateway-proxy]
      operationId: proxyAccountApiAction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RouteKey'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyRequest'
      responses:
        '200':
          description: Ответ account API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyResponse'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      $ref: './openapi-common.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    ProjectId:
      $ref: './openapi-common.yaml#/components/parameters/ProjectId'
    AccountId:
      $ref: './openapi-common.yaml#/components/parameters/AccountId'
    UserId:
      $ref: './openapi-common.yaml#/components/parameters/UserId'
    AddonId:
      $ref: './openapi-common.yaml#/components/parameters/AddonId'
    RouteKey:
      $ref: './openapi-common.yaml#/components/parameters/RouteKey'
    Action:
      $ref: './openapi-common.yaml#/components/parameters/Action'
    IdempotencyKey:
      $ref: './openapi-common.yaml#/components/parameters/IdempotencyKey'

  responses:
    Error:
      $ref: './openapi-common.yaml#/components/responses/Error'

  schemas:
    RequestMeta:
      $ref: './openapi-common.yaml#/components/schemas/RequestMeta'

    ErrorResponse:
      $ref: './openapi-common.yaml#/components/schemas/ErrorResponse'

    AckResponse:
      $ref: './openapi-common.yaml#/components/schemas/AckResponse'

    Project:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, archived, blocked]

    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    ProjectResponse:
      allOf:
        - $ref: '#/components/schemas/RequestMeta'
        - type: object
          required: [project]
          properties:
            project:
              $ref: '#/components/schemas/Project'

    ProjectListResponse:
      allOf:
        - $ref: '#/components/schemas/RequestMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Project'

    ProxyConfig:
      type: object
      required: [host, port, login, password]
      properties:
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        login:
          type: string
        password:
          type: string

    AccountCreateRequest:
      type: object
      required: [platform, displayName, proxyConfig]
      properties:
        accountTypeId:
          type: string
        platform:
          type: string
        displayName:
          type: string
        proxyConfig:
          $ref: '#/components/schemas/ProxyConfig'
        marketplaceAuth:
          $ref: '#/components/schemas/MarketplaceAuth'

    MarketplaceAuth:
      type: object
      required: [scheme, credentials]
      properties:
