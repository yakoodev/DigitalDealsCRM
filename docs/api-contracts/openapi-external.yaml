components:
  securitySchemes:
    bearerAuth:
      $ref: './openapi-common.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    ProjectId:
      $ref: './openapi-common.yaml#/components/parameters/ProjectId'
    AccountId:
      $ref: './openapi-common.yaml#/components/parameters/AccountId'
    UserId:
      $ref: './openapi-common.yaml#/components/parameters/UserId'
    AddonId:
      $ref: './openapi-common.yaml#/components/parameters/AddonId'
    RouteKey:
      $ref: './openapi-common.yaml#/components/parameters/RouteKey'
    Action:
      $ref: './openapi-common.yaml#/components/parameters/Action'
    IdempotencyKey:
      $ref: './openapi-common.yaml#/components/parameters/IdempotencyKey'

  responses:
    Error:
      $ref: './openapi-common.yaml#/components/responses/Error'

  schemas:
    RequestMeta:
      $ref: './openapi-common.yaml#/components/schemas/RequestMeta'

    ErrorResponse:
      $ref: './openapi-common.yaml#/components/schemas/ErrorResponse'

    AckResponse:
      $ref: './openapi-common.yaml#/components/schemas/AckResponse'

    Project:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, archived, blocked]

    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    ProjectResponse:
      allOf:
        - $ref: '#/components/schemas/RequestMeta'
        - type: object
          required: [project]
          properties:
            project:
              $ref: '#/components/schemas/Project'

    ProjectListResponse:
      allOf:
        - $ref: '#/components/schemas/RequestMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Project'

    ProxyConfig:
      type: object
      required: [host, port, login, password]
      properties:
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        login:
          type: string
        password:
          type: string

    AccountCreateRequest:
      type: object
      required: [platform, displayName, proxyConfig]
      properties:
        accountTypeId:
          type: string
        platform:
          type: string
        displayName:
          type: string
        proxyConfig:
          $ref: '#/components/schemas/ProxyConfig'
        marketplaceAuth:
          $ref: '#/components/schemas/MarketplaceAuth'

    MarketplaceAuth:
      type: object
      required: [scheme, credentials]
      properties:
        scheme:
          type: string
          enum: [golden_key, cookies, tokens, login_password]
        credentials:
          type: object
          minProperties: 1
          additionalProperties:
            type: string

    AccountTypeField:
      type: object
      required: [key, label, inputType, required, secret]
      properties:
        key:
          type: string
        label:
          type: string
        inputType:
          type: string
          enum: [text, number, password]
        required:
          type: boolean
        secret:
          type: boolean
        placeholder:
          type: string
        defaultValue:
          type: string

    AccountType:
      type: object
      required:
        - accountTypeId
        - platform
        - displayName
        - workerProfileId
        - enabled
        - sortOrder
        - formFields
      properties:
        accountTypeId:
          type: string
        platform:
          type: string
        displayName:
          type: string
        description:
          type: string
        workerProfileId:
          type: string
        enabled:
          type: boolean
        sortOrder:
          type: integer
        formFields:
          type: array
          items:
            $ref: '#/components/schemas/AccountTypeField'

    AdminAccountTypeRuntime:
      type: object
      required:
        - autospawnEnabled
        - workerImage
        - workerPathPrefix
        - healthPath
        - containerPort
        - environmentVariables
      properties:
        autospawnEnabled:
          type: boolean
        workerImage:
          type: string
        workerPathPrefix:
          type: string
        healthPath:
          type: string
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
        environmentVariables:
          type: object
          additionalProperties:
            type: string
        workerCommand:
          type: array
          items:
            type: string

    AdminAccountType:
      allOf:
