openapi: 3.1.0
info:
  title: DDCRM External API
  version: 0.1.0
  description: Публичный API-контур DDCRM (frontend/client -> platform).
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://api.ddcrm.local
    description: External API
x-cors:
  mode: env
  envFile: .env.external-api.example
  envPrefix: EXTERNAL_API_CORS_
  policy:
    origins: allowlist-only
    wildcardInProduction: forbidden
tags:
  - name: projects
  - name: members
  - name: accounts
  - name: admin
  - name: billing
  - name: gateway-proxy
  - name: integrations
  - name: offers
  - name: workflows

paths:
  /v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список проектов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [projects]
      operationId: createProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}:
    get:
      tags: [projects]
      operationId: getProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Проект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [projects]
      operationId: updateProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Проект обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/members:
    post:
      tags: [members]
      operationId: addMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Участник добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/members/{userId}/role:
    patch:
      tags: [members]
      operationId: changeMemberRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleChangeRequest'
      responses:
        '200':
          description: Роль изменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/members/{userId}:
    delete:
      tags: [members]
      operationId: removeMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Участник удален
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Список аккаунтов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [accounts]
      operationId: createAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '201':
          description: Аккаунт создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/account-types:
    get:
      tags: [accounts]
      operationId: listProjectAccountTypes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Доступные типы аккаунтов для создания в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTypeListResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/account-manager/worker-servers:
    get:
      tags: [admin]
      operationId: adminListWorkerServers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Worker servers для системной админки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorkerServerListResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/account-manager/worker-servers/{serverId}:
    put:
      tags: [admin]
      operationId: adminUpsertWorkerServer
      security:
        - bearerAuth: []
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminWorkerServerUpsertRequest'
      responses:
        '200':
          description: Worker server upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorkerServerResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/account-manager/account-types:
    get:
      tags: [admin]
      operationId: adminListAccountTypes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account type templates для системной админки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountTypeListResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/account-manager/account-types/{accountTypeId}:
    put:
      tags: [admin]
      operationId: adminUpsertAccountType
      security:
        - bearerAuth: []
      parameters:
        - name: accountTypeId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccountTypeUpsertRequest'
      responses:
        '200':
          description: Account type upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountTypeResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/integrations/projects/{projectId}/grants:
    get:
      tags: [admin, integrations]
      operationId: adminListProjectIntegrationGrants
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Список интеграционных grant-ов проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIntegrationGrantListResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/integrations/projects/{projectId}/grants/{integrationKey}:
    put:
      tags: [admin, integrations]
      operationId: adminUpsertProjectIntegrationGrant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: integrationKey
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminIntegrationGrantUpsertRequest'
      responses:
        '200':
          description: Интеграционный grant сохранен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIntegrationGrantResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [admin, integrations]
      operationId: adminRevokeProjectIntegrationGrant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: integrationKey
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Интеграционный grant отозван
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/integrations/projects/{projectId}/grants/{integrationKey}/runtime/provision:
    post:
      tags: [admin, integrations]
      operationId: adminProvisionProjectIntegrationRuntime
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: integrationKey
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Provision runtime поставлен в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/integrations/projects/{projectId}/grants/{integrationKey}/runtime/deprovision:
    post:
      tags: [admin, integrations]
      operationId: adminDeprovisionProjectIntegrationRuntime
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: integrationKey
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Deprovision runtime поставлен в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/integrations/projects/{projectId}/grants/{integrationKey}/runtime/restart:
    post:
      tags: [admin, integrations]
      operationId: adminRestartProjectIntegrationRuntime
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: integrationKey
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Restart runtime поставлен в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/integrations/telegram/proxies:
    get:
      tags: [admin, integrations]
      operationId: adminListTelegramProxyProfiles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список proxy-профилей Telegram бота
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTelegramProxyProfileListResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/integrations/telegram/proxies/{proxyId}:
    put:
      tags: [admin, integrations]
      operationId: adminUpsertTelegramProxyProfile
      security:
        - bearerAuth: []
      parameters:
        - name: proxyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTelegramProxyProfileUpsertRequest'
      responses:
        '200':
          description: Proxy-профиль Telegram сохранен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTelegramProxyProfileResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/integrations/telegram/test-message:
    post:
      tags: [admin, integrations]
      operationId: adminSendTelegramTestMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTelegramTestMessageRequest'
      responses:
        '200':
          description: Тестовое сообщение отправлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTelegramTestMessageResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/admin/integrations/telegram/test-connectivity:
    post:
      tags: [admin, integrations]
      operationId: adminCheckTelegramConnectivity
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Диагностика доступности Telegram API через proxy/direct paths
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTelegramConnectivityResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/status:
    get:
      tags: [projects, integrations]
      operationId: getProjectIntegrationsStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Статус интеграций проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectIntegrationStatusResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/{integrationKey}/runtime/provision:
    post:
      tags: [projects, integrations]
      operationId: provisionProjectIntegrationRuntime
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: integrationKey
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Provision runtime поставлен в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/{integrationKey}/runtime/deprovision:
    post:
      tags: [projects, integrations]
      operationId: deprovisionProjectIntegrationRuntime
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: integrationKey
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Deprovision runtime поставлен в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/{integrationKey}/runtime/restart:
    post:
      tags: [projects, integrations]
      operationId: restartProjectIntegrationRuntime
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: integrationKey
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Restart runtime поставлен в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/steam/accounts:
    get:
      tags: [projects, integrations]
      operationId: listSteamIntegrationAccounts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Список Steam-аккаунтов интеграции проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SteamIntegrationAccountsResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [projects, integrations]
      operationId: createSteamIntegrationAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SteamIntegrationAccountUpsertRequest'
      responses:
        '201':
          description: Steam-аккаунт создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SteamIntegrationAccountResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/steam/accounts/{accountId}:
    patch:
      tags: [projects, integrations]
      operationId: updateSteamIntegrationAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SteamIntegrationAccountUpsertRequest'
      responses:
        '200':
          description: Steam-аккаунт обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SteamIntegrationAccountResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [projects, integrations]
      operationId: archiveSteamIntegrationAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Steam-аккаунт архивирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/steam/jobs:
    get:
      tags: [projects, integrations]
      operationId: listSteamIntegrationJobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: take
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Список Steam jobs проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SteamIntegrationJobsResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [projects, integrations]
      operationId: createSteamIntegrationJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SteamIntegrationJobCreateRequest'
      responses:
        '201':
          description: Steam jobs-задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SteamIntegrationJobResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/steam/jobs/{jobId}/cancel:
    post:
      tags: [projects, integrations]
      operationId: cancelSteamIntegrationJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Steam jobs-задача отменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/{integrationKey}/actions/{scope}:
    post:
      tags: [projects, integrations]
      operationId: invokeProjectIntegrationAction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: integrationKey
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - name: scope
          in: path
          required: true
          schema:
            type: string
            enum: [read, jobs]
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Ответ внешней сервисной интеграции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/telegram/link-codes:
    post:
      tags: [projects, integrations]
      operationId: createTelegramLinkCode
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramLinkCodeCreateRequest'
      responses:
        '200':
          description: Link code создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramLinkCodeResponse'
        default:
          $ref: '#/components/responses/Error'

  /v1/projects/{projectId}/integrations/telegram/user-bind:
    post:
      tags: [projects, integrations]
      operationId: bindTelegramUserChat
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
