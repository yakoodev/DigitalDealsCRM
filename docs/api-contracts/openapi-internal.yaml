openapi: 3.1.0
info:
  title: DDCRM Internal API
  version: 0.1.0
  description: Внутренний API-контур DDCRM (service-to-service).
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://internal.ddcrm.local
    description: Internal API
security:
  - internalServiceToken: []
x-service-auth:
  mode: env
  envFile: .env.internal-api.example
  envPrefix: INTERNAL_API_SERVICE_AUTH_
tags:
  - name: routes
  - name: lifecycle
  - name: worker-control
  - name: billing
  - name: entitlement
  - name: iam

paths:
  /internal/v1/routes/{accountId}:
    put:
      tags: [routes]
      operationId: routeUpsert
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteUpsertRequest'
      responses:
        '200':
          description: Route upsert выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [routes]
      operationId: routeDelete
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Route удален
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/routes/{accountId}/switch:
    post:
      tags: [routes]
      operationId: routeSwitch
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteSwitchRequest'
      responses:
        '200':
          description: Route переключен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/routes/resolve-bulk:
    post:
      tags: [routes]
      operationId: routeResolveBulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteResolveBulkRequest'
      responses:
        '200':
          description: Route bulk resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObjectResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/worker-servers:
    get:
      tags: [worker-control]
      operationId: workerServersList
      responses:
        '200':
          description: Worker server registry snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerServerListResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/account-types:
    get:
      tags: [worker-control]
      operationId: accountTypesList
      responses:
        '200':
          description: Доступные типы аккаунтов для onboarding в проект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTypeListResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/account-types/{accountTypeId}:
    put:
      tags: [worker-control]
      operationId: accountTypeUpsert
      parameters:
        - name: accountTypeId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountTypeUpsertRequest'
      responses:
        '200':
          description: Account type upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTypeResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/worker-servers/{serverId}:
    put:
      tags: [worker-control]
      operationId: workerServerUpsert
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerServerUpsertRequest'
      responses:
        '200':
          description: Worker server upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerServerResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/worker-servers/{serverId}/heartbeat:
    post:
      tags: [worker-control]
      operationId: workerServerHeartbeat
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerServerHeartbeatRequest'
      responses:
        '200':
          description: Worker server heartbeat accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/lifecycle/create:
    post:
      tags: [lifecycle]
      operationId: lifecycleCreate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleCreateRequest'
      responses:
        '202':
          description: Lifecycle create accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/lifecycle/update:
    post:
      tags: [lifecycle]
      operationId: lifecycleUpdate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleUpdateRequest'
      responses:
        '202':
          description: Lifecycle update accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/lifecycle/delete:
    post:
      tags: [lifecycle]
      operationId: lifecycleDelete
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleDeleteRequest'
      responses:
        '202':
          description: Lifecycle delete accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/lifecycle/migrate:
    post:
      tags: [lifecycle]
      operationId: lifecycleMigrate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleMigrateRequest'
      responses:
        '202':
          description: Lifecycle migrate accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/lifecycle/rebalance:
    post:
      tags: [lifecycle]
      operationId: lifecycleRebalance
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRebalanceRequest'
      responses:
        '200':
          description: Lifecycle rebalance completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleRebalanceResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/payments/create:
    post:
      tags: [billing]
      operationId: internalPaymentsCreate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObjectResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/payments/webhook:
    post:
      tags: [billing]
      operationId: internalPaymentsWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/payments/refund:
    post:
      tags: [billing]
      operationId: internalPaymentsRefund
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Refund created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/subscriptions/manual-activate:
    post:
      tags: [billing]
      operationId: internalSubscriptionsManualActivate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Manual activate done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/subscriptions/reconcile:
    post:
      tags: [billing]
      operationId: internalSubscriptionsReconcile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '202':
          description: Reconcile accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/entitlement/check:
    post:
      tags: [entitlement]
      operationId: entitlementCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObjectResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/entitlement/recalculate:
    post:
      tags: [entitlement]
      operationId: entitlementRecalculate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '202':
          description: Recalculate accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/entitlement/override:
    post:
      tags: [entitlement]
      operationId: entitlementOverride
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Override applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/entitlement/{projectId}:
    get:
      tags: [entitlement]
      operationId: entitlementGet
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Entitlement snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObjectResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/iam/check-permission:
    post:
      tags: [iam]
      operationId: iamCheckPermission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Permission check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObjectResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/iam/project-membership/{projectId}/{userId}:
    get:
      tags: [iam]
      operationId: iamProjectMembership
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObjectResponse'
        default:
          $ref: '#/components/responses/Error'

  /internal/v1/iam/membership-cache/invalidate:
    post:
      tags: [iam]
      operationId: iamMembershipCacheInvalidate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObjectRequest'
      responses:
        '200':
          description: Cache invalidated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    internalServiceToken:
      $ref: './openapi-common.yaml#/components/securitySchemes/internalServiceToken'

  parameters:
    ProjectId:
      $ref: './openapi-common.yaml#/components/parameters/ProjectId'
    AccountId:
      $ref: './openapi-common.yaml#/components/parameters/AccountId'
    UserId:
      $ref: './openapi-common.yaml#/components/parameters/UserId'
    IdempotencyKey:
      $ref: './openapi-common.yaml#/components/parameters/IdempotencyKey'

  responses:
    Error:
      $ref: './openapi-common.yaml#/components/responses/Error'

  schemas:
    RequestMeta:
      $ref: './openapi-common.yaml#/components/schemas/RequestMeta'

    ErrorResponse:
      $ref: './openapi-common.yaml#/components/schemas/ErrorResponse'

    AckResponse:
      $ref: './openapi-common.yaml#/components/schemas/AckResponse'

    WorkerBinding:
      type: object
      required: [serverId, workerId]
      properties:
        serverId:
          type: string
        workerId:
          type: string
        podId:
          type: string

    RouteUpsertRequest:
      type: object
      required: [projectId, routeKey, workerBinding, routeVersion]
      properties:
        projectId:
          type: string
          format: uuid
        routeKey:
          type: string
        workerBinding:
          $ref: '#/components/schemas/WorkerBinding'
        routeVersion:
          type: integer
          minimum: 1

    RouteSwitchRequest:
      type: object
      required: [workerBinding, routeVersion]
      properties:
        workerBinding:
          $ref: '#/components/schemas/WorkerBinding'
        routeVersion:
          type: integer
          minimum: 1

    RouteResolveBulkRequest:
      type: object
      required: [routeKeys]
      properties:
        routeKeys:
          type: array
          minItems: 1
          items:
            type: string

    LifecycleCreateRequest:
      type: object
      required: [accountId, projectId, platform, proxyConfig]
      properties:
        accountId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        platform:
          type: string
        proxyConfig:
          type: object
          additionalProperties: true

    LifecycleUpdateRequest:
      type: object
      required: [accountId]
      properties:
        accountId:
          type: string
          format: uuid
        proxyConfig:
          type: object
          additionalProperties: true

    LifecycleDeleteRequest:
      type: object
      required: [accountId]
      properties:
        accountId:
          type: string
          format: uuid

    LifecycleMigrateRequest:
      type: object
      required: [accountId]
      properties:
        accountId:
          type: string
          format: uuid
        targetServerId:
          type: string

    LifecycleRebalanceRequest:
      type: object
      properties:
        maxMoves:
          type: integer
          minimum: 1
          maximum: 200

    LifecycleRebalanceMove:
      type: object
      required: [accountId, fromServerId, toServerId, routeVersion]
      properties:
        accountId:
          type: string
          format: uuid
        fromServerId:
          type: string
        toServerId:
          type: string
        routeVersion:
          type: integer
          minimum: 1

    LifecycleRebalanceResponse:
      allOf:
        - $ref: '#/components/schemas/RequestMeta'
        - type: object
          required: [status, evaluated, moved, migrations]
          properties:
            status:
              type: string
              enum: [completed]
            evaluated:
              type: integer
              minimum: 0
            moved:
              type: integer
              minimum: 0
            migrations:
              type: array
              items:
                $ref: '#/components/schemas/LifecycleRebalanceMove'

    AccountTypeField:
      type: object
      required: [key, label, inputType, required, secret]
      properties:
        key:
          type: string
        label:
          type: string
        inputType:
          type: string
          enum: [text, number, password]
        required:
          type: boolean
        secret:
          type: boolean
        placeholder:
          type: string
        defaultValue:
          type: string

    AccountType:
      type: object
      required:
        - accountTypeId
        - platform
        - displayName
        - workerProfileId
        - enabled
        - sortOrder
        - formFields
        - runtime
      properties:
        accountTypeId:
          type: string
        platform:
          type: string
        displayName:
          type: string
        description:
          type: string
        workerProfileId:
          type: string
        enabled:
          type: boolean
        sortOrder:
          type: integer
        formFields:
          type: array
          items:
            $ref: '#/components/schemas/AccountTypeField'
        runtime:
          $ref: '#/components/schemas/AccountTypeRuntime'

    AccountTypeListResponse:
      allOf:
        - $ref: '#/components/schemas/RequestMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AccountType'

    AccountTypeResponse:
      allOf:
        - $ref: '#/components/schemas/RequestMeta'
        - type: object
          required: [accountType]
          properties:
            accountType:
              $ref: '#/components/schemas/AccountType'

    AccountTypeRuntime:
      type: object
      required:
        - autospawnEnabled
        - workerImage
        - workerPathPrefix
        - healthPath
        - containerPort
        - environmentVariables
      properties:
        autospawnEnabled:
          type: boolean
        workerImage:
          type: string
        workerPathPrefix:
          type: string
        healthPath:
          type: string
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
        environmentVariables:
          type: object
          additionalProperties:
            type: string

    AccountTypeUpsertRequest:
      type: object
      properties:
        platform:
          type: string
        displayName:
          type: string
        description:
          type: string
        workerProfileId:
          type: string
        enabled:
          type: boolean
        sortOrder:
          type: integer
        formFields:
          type: array
          items:
            $ref: '#/components/schemas/AccountTypeField'
        runtime:
          $ref: '#/components/schemas/AccountTypeRuntime'

    WorkerServerMetadata:
      type: object
      additionalProperties: true

    WorkerServerRegistrySummary:
      type: object
      required: [enabled, host, hasToken]
      properties:
        enabled:
          type: boolean
        host:
          type: string
          example: ghcr.io
        username:
          type: [string, 'null']
        hasToken:
          type: boolean
        tokenUpdatedAtUtc:
          type: [string, 'null']
          format: date-time

    WorkerServerRegistryUpsertRequest:
      type: object
      properties:
        enabled:
          type: boolean
        host:
          type: string
          example: ghcr.io
        username:
          type: string
        token:
          type: string
          writeOnly: true
        clearToken:
          type: boolean

    WorkerServer:
      type: object
      required:
        - serverId
        - baseUrlTemplate
        - status
        - health
        - capacity
        - currentLoad
        - registry
        - metadata
      properties:
        serverId:
          type: string
        baseUrlTemplate:
          type: string
        status:
          type: string
          enum: [active, draining, inactive]
        health:
          type: string
          enum: [healthy, degraded, unhealthy]
        capacity:
          type: integer
          minimum: 0
        currentLoad:
          type: integer
          minimum: 0
        dockerHost:
          type: [string, 'null']
        dockerNetwork:
          type: [string, 'null']
        lastHeartbeatAtUtc:
          type: [string, 'null']
          format: date-time
        registry:
          $ref: '#/components/schemas/WorkerServerRegistrySummary'
        metadata:
          $ref: '#/components/schemas/WorkerServerMetadata'

    WorkerServerListResponse:
      allOf:
        - $ref: '#/components/schemas/RequestMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/WorkerServer'

    WorkerServerResponse:
      allOf:
        - $ref: '#/components/schemas/RequestMeta'
        - type: object
          required: [workerServer]
          properties:
            workerServer:
              $ref: '#/components/schemas/WorkerServer'

    WorkerServerUpsertRequest:
      type: object
      properties:
        baseUrlTemplate:
          type: string
        status:
          type: string
          enum: [active, draining, inactive]
        health:
          type: string
          enum: [healthy, degraded, unhealthy]
        capacity:
          type: integer
          minimum: 0
        currentLoad:
          type: integer
          minimum: 0
        dockerHost:
          type: string
        dockerNetwork:
          type: string
        registry:
          $ref: '#/components/schemas/WorkerServerRegistryUpsertRequest'
        metadata:
          $ref: '#/components/schemas/WorkerServerMetadata'

    WorkerServerHeartbeatRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, draining, inactive]
        health:
          type: string
          enum: [healthy, degraded, unhealthy]
        capacity:
          type: integer
          minimum: 0
        currentLoad:
          type: integer
          minimum: 0
        dockerHost:
          type: string
        dockerNetwork:
          type: string
        metadata:
          $ref: '#/components/schemas/WorkerServerMetadata'

    GenericObjectRequest:
      $ref: './openapi-common.yaml#/components/schemas/GenericObjectRequest'

    GenericObjectResponse:
      $ref: './openapi-common.yaml#/components/schemas/GenericObjectResponse'
